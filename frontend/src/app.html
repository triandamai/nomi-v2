<!doctype html>
<html lang="%paraglide.lang%" %nomi.appearance%>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
		<link
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			// After a deploy, a page from the previous build (an open tab, a restored one, a cached copy)
			// asks for app files that no longer exist, and nothing on it can load. Load it again from
			// the server, once: a second failure within a minute stays as it is rather than looping.
			(function () {
				var KEY = 'nomi-stale-build-reload';
				var STALE = /Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported module|Unable to preload CSS/i;
				function reload() {
					try {
						if (Date.now() - Number(sessionStorage.getItem(KEY) || 0) < 60000) return;
						sessionStorage.setItem(KEY, String(Date.now()));
					} catch (e) {
						// No storage (private mode): reload anyway; the new page has the new files.
					}
					location.reload();
				}
				addEventListener('unhandledrejection', function (event) {
					var reason = event.reason;
					if (STALE.test(String((reason && reason.message) || reason || ''))) reload();
				});
				// The failure still reaches SvelteKit: it shows its error page, or loads the new build
				// if there is one. Held back, SvelteKit gets no page module and crashes reading it.
				addEventListener('vite:preloadError', function () {
					reload();
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
