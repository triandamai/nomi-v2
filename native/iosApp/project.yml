# Source of truth for iosApp.xcodeproj — regenerate with `xcodegen generate` in native/iosApp.
name: iosApp
options:
  bundleIdPrefix: ai.nomi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # The Gradle build phase reads and writes outside the sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Nomi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets Compose render at 120 Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        # Backend the shared code talks to (read by MainViewController), from the NOMI_API_URL build setting.
        NomiApiUrl: $(NOMI_API_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.nomi.app
        PRODUCT_NAME: Nomi
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
      configs:
        # The simulator reaches the Mac's local backend (nomi-server listens on 8080).
        Debug:
          NOMI_API_URL: http://localhost:8080
        # Must be set for release builds (NOMI_API_URL=https://… xcodebuild …); the build fails without it.
        Release:
          NOMI_API_URL: ""
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          if [ -z "$JAVA_HOME" ]; then
            export JAVA_HOME="$(/usr/libexec/java_home -v 17)"
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:app:embedAndSignAppleFrameworkForXcode
      - name: Require a backend URL for release
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ] && [ -z "$NOMI_API_URL" ]; then
            echo "error: set NOMI_API_URL (https) for release builds"
            exit 1
          fi
    postBuildScripts:
      # Debug only: plain HTTP to local addresses (the development backend). Release keeps App Transport Security whole.
      - name: Allow local networking in Debug
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"
          fi
