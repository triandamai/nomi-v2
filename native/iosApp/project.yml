# Source of truth for iosApp.xcodeproj — regenerate with `xcodegen generate` in native/iosApp.
name: iosApp
options:
  bundleIdPrefix: ai.nomi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # The Gradle build phase reads and writes outside the sandbox.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Nomi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets Compose render at 120 Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        # A backend this build overrides to (read by MainViewController); empty means nomi.apiUrl in native/gradle.properties.
        NomiApiUrl: $(NOMI_API_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.nomi.app
        PRODUCT_NAME: Nomi
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
        # Empty: the app uses nomi.apiUrl from native/gradle.properties, like Android and desktop. For the Mac's local
        # backend (nomi-server listens on 8080), build with NOMI_API_URL=http://localhost:8080.
        NOMI_API_URL: ""
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          if [ -z "$JAVA_HOME" ]; then
            export JAVA_HOME="$(/usr/libexec/java_home -v 17)"
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:app:embedAndSignAppleFrameworkForXcode
      - name: Require an https backend for release
        basedOnDependencyAnalysis: false
        script: |
          URL="${NOMI_API_URL:-$(sed -n 's/^nomi\.apiUrl=//p' "$SRCROOT/../gradle.properties" | tr -d '[:space:]')}"
          if [ "$CONFIGURATION" = "Release" ]; then
            case "$URL" in
              https://*) ;;
              *) echo "error: release builds need an https backend: set nomi.apiUrl in native/gradle.properties (or NOMI_API_URL)"; exit 1 ;;
            esac
          fi
    postBuildScripts:
      # Debug only: plain HTTP to local addresses (the development backend). Release keeps App Transport Security whole.
      - name: Allow local networking in Debug
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"
          fi
