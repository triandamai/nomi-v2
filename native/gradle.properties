org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g

android.useAndroidX=true
android.nonTransitiveRClass=true

# The backend every app talks to (Android, desktop, iOS). Change it here and rebuild; nothing else needs editing.
# Release builds need https. One-off overrides: -Pnomi.apiUrl.debug=http://10.0.2.2:8080 (Android debug),
# NOMI_API_URL=http://localhost:8080 (desktop run, or the iOS build setting).
nomi.apiUrl=https://api-staging.nomi.build

# App version, shared by the Android, desktop and iOS shells
nomi.versionName=1.0.0
nomi.versionCode=1
