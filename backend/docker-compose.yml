services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nomi
      POSTGRES_PASSWORD: nomi
      POSTGRES_DB: nomi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  emqx:
    image: emqx/emqx:5.8.9
    ports:
      - "1883:1883"
      - "18083:18083"
    volumes:
      - emqxdata:/opt/emqx/data

volumes:
  pgdata:
  emqxdata:
