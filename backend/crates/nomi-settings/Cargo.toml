[package]
name = "nomi-settings"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
