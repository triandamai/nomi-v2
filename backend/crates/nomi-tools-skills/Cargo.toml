[package]
name = "nomi-tools-skills"
version = "0.1.0"
edition = "2021"

[dependencies]
nomi-skills = { path = "../nomi-skills" }
nomi-tool = { path = "../nomi-tool" }
nomi-llm = { path = "../nomi-llm" }
async-trait = "0.1"
serde_json = "1"
nomi-tools-web = { path = "../nomi-tools-web" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["time"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false }
