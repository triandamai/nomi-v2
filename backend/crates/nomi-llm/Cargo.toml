[package]
name = "nomi-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-core = "0.3.33"
futures-util = "0.3.33"
eventsource-stream = "0.2.3"
async-stream = "0.3.6"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
