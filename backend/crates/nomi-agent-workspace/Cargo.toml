[package]
name = "nomi-agent-workspace"
version = "0.1.0"
edition = "2021"

[dependencies]
nomi-i18n = { path = "../nomi-i18n" }
nomi-agent-core = { path = "../nomi-agent-core" }
nomi-llm = { path = "../nomi-llm" }
nomi-settings = { path = "../nomi-settings" }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
nomi-test-support = { path = "../nomi-test-support" }
