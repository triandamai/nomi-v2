[package]
name = "nomi-agent-core"
version = "0.1.0"
edition = "2021"

[dependencies]
nomi-i18n = { path = "../nomi-i18n" }
nomi-llm = { path = "../nomi-llm" }
nomi-embedding = { path = "../nomi-embedding" }
nomi-realtime = { path = "../nomi-realtime" }
nomi-storage = { path = "../nomi-storage" }
nomi-attachments = { path = "../nomi-attachments" }
base64 = "0.22"
async-trait = "0.1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde_json = "1"
thiserror = "1"
futures-util = "0.3.33"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
tracing = "0.1.44"
nomi-settings = { path = "../nomi-settings" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
regex = "1"
tokio = { version = "1", features = ["net", "time"] }

[features]
# Model-call retries don't wait between attempts. For other crates' tests only (they enable it
# as a dev-dependency feature, which never reaches a release build): their failing fake provider
# would otherwise sit through the real 2s..30s backoff for up to ten attempts.
instant-retries = []

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
nomi-test-support = { path = "../nomi-test-support" }
