[package]
name = "nomi-tools-background"
version = "0.1.0"
edition = "2021"

[dependencies]
nomi-tool = { path = "../nomi-tool" }
nomi-llm = { path = "../nomi-llm" }
nomi-realtime = { path = "../nomi-realtime" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["process", "io-util", "time", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
