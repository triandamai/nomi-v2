[package]
name = "nomi-realtime"
version = "0.1.0"
edition = "2021"

[dependencies]
nomi-llm = { path = "../nomi-llm" }
rumqttc = "0.25.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
