name: Native

# The Kotlin Multiplatform apps under native/: tests with a report in the job summary, and a build for every
# platform (Android, desktop on Linux, macOS and Windows, iOS), plus the Rust SDK under rust/ they bind to
# (native/shared/sdk builds it with cargo). Runs only when something the apps are built from changed: native/ or
# rust/ itself, the web sources the design tokens and views are generated or checked from, or this workflow.
on:
  pull_request:
    paths:
      - "native/**"
      - "rust/**"
      - "frontend/src/lib/styles/material3.css"
      - "frontend/src/lib/components/m3/shapes.ts"
      - "frontend/src/lib/crewNames.ts"
      - "frontend/src/lib/views/examples.json"
      - ".github/workflows/native.yml"
      - ".github/scripts/junit-summary.py"
  push:
    branches: [main]
    paths:
      - "native/**"
      - "rust/**"
      - "frontend/src/lib/styles/material3.css"
      - "frontend/src/lib/components/m3/shapes.ts"
      - "frontend/src/lib/crewNames.ts"
      - "frontend/src/lib/views/examples.json"
      - ".github/workflows/native.yml"
      - ".github/scripts/junit-summary.py"
  workflow_dispatch:

# A new commit on a PR cancels that PR's still-running run; main gets a group per commit.
concurrency:
  group: native-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The project's JVM toolchain (native/gradle/libs.versions.toml: jvm-toolchain).
  JAVA_VERSION: "17"
  # compileSdk 37 (Compose 1.12 / lifecycle 2.11 need it); the runner image may not ship it yet.
  ANDROID_PLATFORM: "platforms;android-37.0"
  GRADLE_OPTS: -Dorg.gradle.daemon=false

defaults:
  run:
    working-directory: native

jobs:
  rust-sdk:
    name: Rust SDK (cargo test + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  test:
    name: Tests (desktop JVM + Android host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v5

      # :shared:sdk builds the Rust SDK for the desktop tests and installs gobley-uniffi-bindgen into rust/target.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" > /dev/null

      # Each module's desktop and Android host tests (iOS runs on the macOS job below). Not allTests:
      # it compiles the iOS tests too, and the SDK's iOS build needs Apple's toolchain.
      # --continue reports every module's failures, not just the first.
      - name: Run tests
        run: ./gradlew desktopTest testAndroidHostTest :desktopApp:test --continue

      - name: Test report
        if: always()
        working-directory: .
        run: python3 .github/scripts/junit-summary.py native "Native tests — desktop JVM + Android host" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: native-test-reports
          path: |
            native/**/build/reports/tests/
            native/**/build/test-results/
          retention-days: 14

  ios:
    name: iOS (simulator tests + app build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v5

      # :shared:sdk links the Rust SDK as a static library per iOS target.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run iOS simulator tests
        run: ./gradlew iosSimulatorArm64Test --continue

      - name: Test report
        if: always()
        working-directory: .
        run: python3 .github/scripts/junit-summary.py native "Native tests — iOS simulator" >> "$GITHUB_STEP_SUMMARY"

      # The Xcode project's build phase compiles the Kotlin framework itself (embedAndSignAppleFrameworkForXcode).
      # arm64 only: the app ships the Apple-silicon simulator framework (iosSimulatorArm64), and a generic
      # simulator destination would otherwise also ask for x86_64.
      - name: Build the iOS app for the simulator
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: native-ios-test-reports
          path: |
            native/**/build/reports/tests/
            native/**/build/test-results/
          retention-days: 14

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v5

      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" > /dev/null

      # :shared:sdk builds the Rust SDK for each packaged ABI with cargo-ndk and the runner's NDK.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Assemble debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./gradlew :androidApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: nomi-android-debug
          path: native/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # One installer per OS: .deb on Linux, .dmg on macOS, .msi on Windows (desktopApp's targetFormats).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v5

      # The installer carries the Rust SDK built for this OS (:shared:sdk puts it on the classpath for JNA).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Package for this OS
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: nomi-desktop-${{ runner.os }}
          path: |
            native/desktopApp/build/compose/binaries/main/deb/*.deb
            native/desktopApp/build/compose/binaries/main/dmg/*.dmg
            native/desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  native-tokens:
    name: Native design tokens (generator tests + freshness)
    runs-on: ubuntu-latest
    # The generator lives in native/scripts but reads the web sources, so it runs from the repo root.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generator tests
        run: node --test native/scripts/*.test.mjs

      # Fails when material3.css or shapes.ts changed without regenerating NomiTokens.kt.
      - name: Generated tokens are up to date
        run: node native/scripts/gen-tokens.mjs --check
