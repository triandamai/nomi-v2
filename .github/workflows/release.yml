name: Release

# Deploy: only version tags trigger a build+push+deploy — PRs and merges to main only
# run Test (see test.yml). Push a tag like v1.2.3 to publish images, then roll out the
# backend first (it runs the database migrations) and the frontend after it.
on:
  push:
    tags: ['v*.*.*']

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build-and-push:
    name: Build and push images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Shipyard registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SHIPYARD_REGISTRY_HOST }}
          username: ci
          password: ${{ secrets.SHIPYARD_REGISTRY_KEY }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ secrets.SHIPYARD_REGISTRY_HOST }}/${{ secrets.SHIPYARD_IMAGE_PREFIX }}/backend:${{ github.ref_name }}
            ${{ secrets.SHIPYARD_REGISTRY_HOST }}/${{ secrets.SHIPYARD_IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ${{ secrets.SHIPYARD_REGISTRY_HOST }}/${{ secrets.SHIPYARD_IMAGE_PREFIX }}/frontend:${{ github.ref_name }}
            ${{ secrets.SHIPYARD_REGISTRY_HOST }}/${{ secrets.SHIPYARD_IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy (backend, then frontend)
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # One rollout at a time: a newer tag waits for the running deploy instead of racing it.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      BACKEND_HOOK: ${{ secrets.SHIPYARD_BACKEND_DEPLOY_HOOK }}
      FRONTEND_HOOK: ${{ secrets.SHIPYARD_FRONTEND_DEPLOY_HOOK }}
      # Optional: the backend's health URL. When set, the frontend waits until it answers.
      BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
    steps:
      - name: Check deploy hooks are set
        run: |
          missing=""
          [ -n "$BACKEND_HOOK" ] || missing="$missing SHIPYARD_BACKEND_DEPLOY_HOOK"
          [ -n "$FRONTEND_HOOK" ] || missing="$missing SHIPYARD_FRONTEND_DEPLOY_HOOK"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Trigger backend deploy
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 60 \
            -X POST "$BACKEND_HOOK"
          echo "Backend deploy triggered for ${{ github.ref_name }}"

      - name: Wait for the backend to come up
        if: env.BACKEND_HEALTH_URL != ''
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 10 "$BACKEND_HEALTH_URL" > /dev/null; then
              echo "Backend is up (attempt $attempt)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend didn't answer at BACKEND_HEALTH_URL within 10 minutes; frontend not deployed"
          exit 1

      - name: Trigger frontend deploy
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 60 \
            -X POST "$FRONTEND_HOOK"
          echo "Frontend deploy triggered for ${{ github.ref_name }}"
