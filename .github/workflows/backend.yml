name: Backend

# The Rust backend under backend/: cargo test (with coverage) against Postgres and EMQX, with test and
# coverage reports in the job summary.
# Runs on pull requests and merges to main only when one of the paths below changed, so a change
# elsewhere in the repo doesn't run it. Also called
# by release.yml, which always runs it, so a tagged build never publishes without a green run.
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - '.github/scripts/cargo-test-summary.py'
      - '.github/scripts/llvm-cov-summary.py'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - '.github/scripts/cargo-test-summary.py'
      - '.github/scripts/llvm-cov-summary.py'
  workflow_call:
  workflow_dispatch:

# A new commit on a PR cancels that PR's still-running check. Runs on main and tag releases get
# a group per ref+commit, so they never cancel or queue behind each other.
concurrency:
  group: backend-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Without debug info: the workspace's test binaries with it outgrew the runner's disk. A failing
  # test still prints its panic and line; only a debugger would miss it.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  backend:
    name: Backend (cargo test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nomi
          POSTGRES_PASSWORD: nomi
          POSTGRES_DB: nomi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nomi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # nomi-realtime's integration test connects to a real broker on localhost:1883,
      # matching backend/docker-compose.yml's local dev setup — no env override exists,
      # so this service must be reachable at that exact host:port.
      emqx:
        image: emqx/emqx:5.8.9
        ports:
          - 1883:1883
    env:
      DATABASE_URL: postgres://nomi:nomi@localhost:5432/nomi
      # Test-only placeholders — never used outside this ephemeral CI database.
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      SETTINGS_ENCRYPTION_KEY: ca56652b62a97555ffc35331260ee457cb2ffafacdefdf2e9e5e5388e7f81ea5
    steps:
      - uses: actions/checkout@v6

      # The runner's image carries toolchains this job never uses; removing them leaves room for
      # the build (it ran out of disk linking the test binaries).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Wait for EMQX
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/1883) >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "EMQX did not become ready on localhost:1883" && exit 1

      # The workspace's tests, built once with coverage on (a separate plain `cargo test` build
      # wouldn't fit on the runner's disk next to it). The log feeds the test report below;
      # pipefail keeps a failing test failing this step.
      - name: cargo test --workspace (with coverage)
        working-directory: backend
        run: |
          set -o pipefail
          cargo llvm-cov --workspace --no-report 2>&1 | tee cargo-test.log

      - name: Coverage report
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          cargo llvm-cov report --json --summary-only --output-path coverage.json
          cargo llvm-cov report --html --output-dir coverage

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('backend/coverage.json') != '' }}
        run: python3 .github/scripts/llvm-cov-summary.py backend/coverage.json backend >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('backend/coverage.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: |
            backend/coverage.json
            backend/coverage/html
          retention-days: 14

      # The backend's counterpart to Vitest's report on the frontend job: totals, failures with
      # their output, tests that ran over 60s, and every test binary's time.
      - name: Test report
        if: always()
        run: |
          if [ -f backend/cargo-test.log ]; then
            python3 .github/scripts/cargo-test-summary.py backend/cargo-test.log >> "$GITHUB_STEP_SUMMARY"
          fi
