name: Frontend (new)

# The new SvelteKit frontend under frontend-new/ (rebuilt from the pen.dev design system): type
# check, unit tests and component tests in a real Chromium (with a coverage summary on the run
# page), a production build, end-to-end smoke tests and the Docker image build. Runs on pull requests and merges to main only when
# frontend-new/ or this file changed, like the other per-area workflows. Also called by
# release.yml, so a tagged build never publishes without a green run.
on:
  pull_request:
    paths:
      - 'frontend-new/**'
      - '.github/workflows/frontend-new.yml'
  push:
    branches: [main]
    paths:
      - 'frontend-new/**'
      - '.github/workflows/frontend-new.yml'
  workflow_call:
  workflow_dispatch:

# A new commit on a PR cancels that PR's still-running check. Runs on main get a group per
# ref+commit, so they never cancel or queue behind each other.
concurrency:
  group: frontend-new-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-new:
    name: Frontend new (check + unit + component + e2e tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-new
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json

      - name: npm ci
        run: npm ci

      # Component tests run in a real Chromium; cache it by the pinned Playwright version.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Chromium system libraries
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Type check
        run: npm run check

      # Unit (Node) and component (Chromium) tests in one run, so their coverage merges into a
      # single report.
      - name: Unit + component tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('frontend-new/coverage/coverage-summary.json') != '' }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('frontend-new/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: frontend-new-coverage
          path: frontend-new/coverage
          retention-days: 14

      - name: Build
        run: npm run build

      # The production server (server.js with the live-update relay) in a real browser, against a
      # stub backend (e2e/stub-api.mjs).
      - name: End-to-end smoke tests
        run: npm run test:e2e

  docker:
    name: Frontend new (Docker image builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # Built, not pushed: release.yml publishes and deploys it from a version tag.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: frontend-new
          push: false
          cache-from: type=gha,scope=frontend-new
          cache-to: type=gha,mode=max,scope=frontend-new
