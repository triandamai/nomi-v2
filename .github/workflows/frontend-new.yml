name: Frontend (new)

# The new SvelteKit frontend under frontend-new/ (rebuilt from the pen.dev design system): type
# check, unit tests, component tests in a real Chromium, a production build, end-to-end smoke
# tests and the Docker image build, then the design-system docs published to Cloudflare Pages.
# Runs on pull requests and merges to main only when frontend-new/ or this file changed, like the
# other per-area workflows.
on:
  pull_request:
    paths:
      - 'frontend-new/**'
      - '.github/workflows/frontend-new.yml'
  push:
    branches: [main]
    paths:
      - 'frontend-new/**'
      - '.github/workflows/frontend-new.yml'
  workflow_call:
  workflow_dispatch:

# A new commit on a PR cancels that PR's still-running check. Runs on main get a group per
# ref+commit, so they never cancel or queue behind each other.
concurrency:
  group: frontend-new-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-new:
    name: Frontend new (check + unit + component + e2e tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-new
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json

      - name: npm ci
        run: npm ci

      # Component tests run in a real Chromium; cache it by the pinned Playwright version.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Chromium system libraries
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Component tests
        run: npm run test:components

      - name: Build
        run: npm run build

      # The production server (server.js with the live-update relay) in a real browser, against a
      # stub backend (e2e/stub-api.mjs).
      - name: End-to-end smoke tests
        run: npm run test:e2e

  docker:
    name: Frontend new (Docker image builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # Built, not pushed: publishing comes with the deploy job, after a release.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: frontend-new
          push: false
          cache-from: type=gha,scope=frontend-new
          cache-to: type=gha,mode=max,scope=frontend-new

  # The design-system docs for the whole team: the static copy (npm run build:gallery) on Cloudflare
  # Pages, once the checks above pass. A merge to main updates the live site; a pull request from
  # this repository publishes a preview of its branch. Skipped, with a notice, until the repository
  # has CLOUDFLARE_API_TOKEN (Pages: edit) and CLOUDFLARE_ACCOUNT_ID as secrets.
  docs:
    name: Frontend new (design-system docs on Cloudflare Pages)
    needs: frontend-new
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      DOCS_PAGES_PROJECT: ${{ vars.DOCS_PAGES_PROJECT || 'nomi-design-system' }}
    steps:
      - name: Cloudflare credentials
        id: credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Docs not published: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.credentials.outputs.ready == 'true'

      - name: Install Node
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json

      - name: npm ci
        if: steps.credentials.outputs.ready == 'true'
        working-directory: frontend-new
        run: npm ci

      - name: Build the static docs
        if: steps.credentials.outputs.ready == 'true'
        working-directory: frontend-new
        run: npm run build:gallery

      - name: Publish to Cloudflare Pages
        if: steps.credentials.outputs.ready == 'true'
        working-directory: frontend-new
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/docs/deploy.mjs --branch "$BRANCH" --sha "$SHA"
