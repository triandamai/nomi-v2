name: Relay service

# The Relay service under relay/crates (control plane and gateway): cargo test against a real
# Postgres, since provisioning, roles, row-level security and migrations are what it does; and its
# functions runtime (relay/functions-runtime, Deno) with deno test. Runs only when the service's
# own files change; the npm packages have relay.yml.
on:
  pull_request:
    paths:
      - 'relay/crates/**'
      - 'relay/migrations/**'
      - 'relay/Cargo.toml'
      - 'relay/Cargo.lock'
      - 'relay/Dockerfile'
      - 'relay/functions-runtime/**'
      - '.github/workflows/relay-service.yml'
  push:
    branches: [main]
    paths:
      - 'relay/crates/**'
      - 'relay/migrations/**'
      - 'relay/Cargo.toml'
      - 'relay/Cargo.lock'
      - 'relay/Dockerfile'
      - 'relay/functions-runtime/**'
      - '.github/workflows/relay-service.yml'
  workflow_dispatch:

concurrency:
  group: relay-service-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}@{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Relay service (cargo test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The test user creates databases, schemas and roles, as Relay's own user does.
      DATABASE_URL: postgres://relay:relay@localhost:5432/relay
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay

      - name: cargo test --workspace
        working-directory: relay
        run: cargo test --workspace

  functions-runtime:
    name: Functions runtime (deno test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          # The version the runtime's Dockerfile runs.
          deno-version: v2.3.3

      - name: deno test
        working-directory: relay/functions-runtime
        run: deno task test
