# The Nomi client SDK: a workspace of its own, apart from the backend's.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Pinned to the version gobley-uniffi-bindgen 0.3.7 generates Kotlin Multiplatform bindings for.
uniffi = "=0.29.4"
thiserror = "2"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
url = "2"
# bundled: one SQLite version, compiled for every target, instead of whatever the platform ships.
rusqlite = { version = "0.41", features = ["bundled"] }
# Networking. TLS is rustls on ring with bundled Mozilla roots on every platform: aws-lc-rs needs
# cmake to cross-compile for iOS/Android, and the platform verifier needs JNI setup on Android.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
fastrand = "2"
# The backend's timestamps are RFC 3339 (chrono `DateTime<Utc>`).
time = { version = "0.3", default-features = false, features = ["std", "parsing"] }
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
