[package]
name = "relay-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "relay-server"
path = "src/main.rs"

[dependencies]
relay-core = { path = "../relay-core" }
relay-control = { path = "../relay-control" }
relay-migrate = { path = "../relay-migrate" }
relay-gateway = { path = "../relay-gateway" }
relay-auth = { path = "../relay-auth" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "migrate"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
object_store = "0.11"
percent-encoding = "2"
futures = "0.3"
bytes = "1"
base64 = "0.22"
chrono = "0.4"
croner = "2"

[dev-dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false }
sha2 = "0.10"
url = "2"
jsonwebtoken = "9"
wiremock = "0.6"
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
tokio-tungstenite = "0.24"
futures = "0.3"
